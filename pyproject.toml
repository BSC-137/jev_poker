[project]
name = "jev_poker"
version = "0.1.0"
description = "Local play-money 4-handed No-Limit Texas Hold'em engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "treys>=0.1.8",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
